# ---------------------------------------------------------------------------
# Serving a single-page application.
#
# Two rules do the work: every unknown path falls back to index.html, because
# the routes are react-router's and the server has never heard of them; and the
# hashed asset files are cached hard while index.html is not cached at all —
# it is the file that names the new hashes, so a cached one pins a browser to
# the previous deployment.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Traefik sits in front and terminates TLS, so this speaks plain HTTP and
    # says nothing about which host it is answering as.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # Vite fingerprints everything under /assets, so a file at a given name can
    # never change. A year, and never revalidated.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Not cached, deliberately. This is the document that names the current
    # asset hashes; served from cache it points a returning browser at files
    # that were deleted by the last deployment, and the panel loads as a blank
    # page until somebody hard-refreshes.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # The panel also ships four files that Vite does **not** fingerprint —
    # favicon.svg, icons.svg, logo.png and index.html itself. They keep their
    # names across deployments, so cached hard they would never be replaced:
    # the icon sprite in particular is one file the whole panel draws from.
    #
    # Revalidated rather than uncached. The browser still asks, and gets a 304
    # and no body when nothing has changed, which costs a header exchange and
    # keeps a redrawn logo from taking a week to appear.
    location ~* ^/[^/]+\.(svg|png|ico|webmanifest)$ {
        add_header Cache-Control "no-cache";
    }

    # The health probe. A static file server has nothing to check but itself,
    # and answering here costs no disk read.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Everything else is a client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
